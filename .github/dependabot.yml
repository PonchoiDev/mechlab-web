# Dependabot abre pull requests con las actualizaciones de las dependencias y de las acciones del CI,
# y avisa de las vulnerabilidades conocidas. El CI de cada pull request comprueba que nada se rompe.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Los parches y versiones menores van juntos; cada versión mayor llega en su propio pull request,
    # para revisarla por separado (por ejemplo, un TypeScript nuevo).
    groups:
      dependencias:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node siguen la versión que usan el CI y el README (Node 24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
