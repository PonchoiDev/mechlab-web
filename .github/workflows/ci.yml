name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests con cobertura
        run: npm run coverage

      - name: Resumen de cobertura
        if: always()
        run: |
          node -e '
            const total = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"]
              .map(key => `| ${key} | ${total[key].pct} % | ${total[key].covered} / ${total[key].total} |`);
            console.log(["### Cobertura de tests", "", "| | % | Cubierto |", "|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
